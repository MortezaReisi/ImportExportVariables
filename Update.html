<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Update Variables</title>
  <style>
    :root {
      --spacing: 0.8rem;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--figma-color-bg);
      color: var(--figma-color-text);
      margin: 0;
      padding: var(--spacing);
      font-family: system-ui, sans-serif;
    }

    html,
    body,
    main {
      height: 100%;
    }

    main {
      display: flex;
      flex-direction: column;
      gap: var(--spacing);
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: var(--spacing);
      border: 1px solid var(--figma-color-border);
      border-radius: 4px;
      font-family: inherit;
      font-size: 1rem;
    }

    button {
      appearance: none;
      border-radius: 4px;
      padding: var(--spacing);
      background-color: var(--figma-color-primary);
      color: var(--figma-color-text-on-primary);
      border: none;
      cursor: pointer;
      margin-top: var(--spacing);
    }

    button:hover {
      background-color: var(--figma-color-primary-hover);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: var(--spacing);
    }

    th, td {
      padding: var(--spacing);
      border: 1px solid var(--figma-color-border);
      text-align: left;
    }

    th {
      background-color: var(--figma-color-bg-hover);
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      padding: var(--spacing) 0;
      border-bottom: 1px solid var(--figma-color-border);
    }
  </style>
</head>
<body>
  <main>
    <h1>Update Variables</h1>

    <!-- Textarea to paste JSON -->
    <section>
      <h2>Paste JSON Data</h2>
      <textarea id="json-input" placeholder="Paste your JSON here..."></textarea>
      <button id="load-json">Load JSON</button>
    </section>

    <!-- Statistics Section -->
    <section>
      <p>New Variables: <span id="new-count">0</span></p>
      <p>Updated Variables: <span id="updated-count">0</span></p>
      <p>Unchanged Variables: <span id="unchanged-count">0</span></p>
    </section>

    <!-- New Variables Section -->
    <section>
      <h2>New Variables</h2>
      <ul id="new-variables"></ul>
      <button id="add-all-new">Add All New Variables</button>
    </section>

    <!-- Updated Variables Section -->
    <section>
      <h2>Updated Variables</h2>
      <table>
        <thead>
          <tr>
            <th>Variable Name</th>
            <th>Current Version</th>
            <th>Updated Version</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="updated-variables"></tbody>
      </table>
      <button id="update-all">Update All Variables</button>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Handle JSON loading
      document.getElementById('load-json').addEventListener('click', () => {
        const jsonInput = document.getElementById('json-input').value;
        try {
          const jsonData = JSON.parse(jsonInput);
          parent.postMessage({ pluginMessage: { type: 'LOAD_UPDATE_DATA', data: jsonData } }, '*');
        } catch (error) {
          alert('Invalid JSON. Please check your input.');
        }
      });

      // Load update data from the Figma plugin
      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (message.type === 'UPDATE_DATA_PROCESSED') {
          const { newVariables, updatedVariables, unchangedCount } = message;

          // Update counts
          document.getElementById('new-count').textContent = newVariables.length;
          document.getElementById('updated-count').textContent = updatedVariables.length;
          document.getElementById('unchanged-count').textContent = unchangedCount;

          // Populate New Variables
          const newVariablesList = document.getElementById('new-variables');
          newVariablesList.innerHTML = '';
          newVariables.forEach((variable) => {
            const li = document.createElement('li');
            li.textContent = variable.name;
            newVariablesList.appendChild(li);
          });

          // Populate Updated Variables Table
          const updatedVariablesTable = document.getElementById('updated-variables');
          updatedVariablesTable.innerHTML = '';
          updatedVariables.forEach(({ name, current, updated }) => {
            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${name}</td>
              <td>${current}</td>
              <td>${updated}</td>
              <td><button data-name="${name}">Update</button></td>
            `;
            updatedVariablesTable.appendChild(row);
          });

          // Attach update button listeners
          document.querySelectorAll('#updated-variables button').forEach((button) =>
            button.addEventListener('click', () => {
              parent.postMessage(
                { pluginMessage: { type: 'UPDATE_VARIABLE', name: button.dataset.name } },
                '*'
              );
            })
          );
        }
      };

      // Add event listener for Update All button
      document.getElementById('update-all').addEventListener('click', () => {
        parent.postMessage({ pluginMessage: { type: 'UPDATE_ALL' } }, '*');
      });

      // Add event listener for Add All New button
      document.getElementById('add-all-new').addEventListener('click', () => {
        parent.postMessage({ pluginMessage: { type: 'ADD_ALL_NEW' } }, '*');
      });
    });
  </script>
</body>
</html>
