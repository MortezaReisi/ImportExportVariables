<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Variables</title>
    <style>
        :root {
            --primary-bg: #121212;
            --secondary-bg: #1e1e1e;
            --border-color: #3c3c3c;
            --text-color: #ffffff;
            --button-bg: #007acc;
            --button-hover: #005f99;
            --input-bg: #252526;
            --input-text: #ffffff;
        }
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: var(--primary-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
        }
        label {
            font-size: 16px;
            font-weight: bold;
        }
        select, textarea {
            background-color: var(--input-bg);
            color: var(--input-text);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            width: 100%;
            font-size: 16px;
        }
        .export-button {
            background: var(--button-bg);
            color: var(--text-color);
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .export-button:hover {
            background: var(--button-hover);
        }
    </style>
</head>
<body>
    <div class="container">
        <label for="collectionSelect">Select Collection</label>
        <select id="collectionSelect">
            <option value="" disabled selected>Loading...</option>
        </select>

        <label for="jsonOutput">Exported JSON</label>
        <textarea id="jsonOutput" rows="10" readonly></textarea>

        <button class="export-button" onclick="exportVariables()">Export Variables</button>
    </div>

    <script>
        window.onmessage = (event) => {
            const msg = event.data.pluginMessage;
            console.log("[UI] Received message:", msg);

            if (msg.type === "collectionsFetched") {
                const select = document.getElementById("collectionSelect");
                select.innerHTML = "";
                
                msg.collections.forEach(collection => {
                    let option = document.createElement("option");
                    option.value = collection.id;
                    option.textContent = collection.name;
                    select.appendChild(option);
                });

                console.log("[UI] Collections loaded successfully.");
            } 
            else if (msg.type === "exportedData") {
                document.getElementById("jsonOutput").value = JSON.stringify(msg.data, null, 2);
            } 
            else if (msg.type === "error") {
                alert("Error: " + msg.message);
            }
        };

        function fetchCollections() {
            console.log("[UI] Requesting collections...");
            parent.postMessage({ pluginMessage: { type: "fetchCollections" } }, "*");
        }

        function exportVariables() {
            const collectionId = document.getElementById("collectionSelect").value;
            if (!collectionId) {
                alert("Please select a collection first.");
                return;
            }
            console.log("[UI] Exporting collection:", collectionId);
            parent.postMessage({ pluginMessage: { type: "export", collectionId } }, "*");
        }

        fetchCollections();
    </script>
</body>
</html>
