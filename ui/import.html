<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import Variables</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #121212;
            --secondary-bg: #1e1e1e;
            --border-color: #3c3c3c;
            --text-color: #ffffff;
            --button-bg: #007acc;
            --button-hover: #005f99;
            --input-bg: #252526;
            --input-text: #ffffff;
        }
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: var(--primary-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        label {
            margin-bottom: 6px;
            font-size: 18px;
            font-weight: bold;
            color: var(--text-color);
        }
        input, textarea {
            background-color: var(--input-bg);
            color: var(--input-text);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 6px;
            width: 100%;
            font-size: 16px;
        }
        .json-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }
        .add-button {
            background: var(--button-bg);
            color: var(--text-color);
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: background 0.2s;
        }
        .add-button:hover {
            background: var(--button-hover);
        }
        .add-button .material-icons {
            font-size: 22px;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="input-group">
            <label for="collectionName">Collection Name</label>
            <input id="collectionName" type="text" placeholder="Enter Collection Name">
        </div>
        <div class="json-container">
            <label for="jsonInput">Variables JSON</label>
            <textarea id="jsonInput" rows="10" placeholder="Paste your JSON here..."></textarea>
        </div>
        <button class="add-button" onclick="importVariables()">
            <span class="material-icons">add</span>
            Add Variables
        </button>
    </div>

    <script>
        function importVariables() {
            const collectionName = document.getElementById('collectionName').value.trim();
            const jsonInput = document.getElementById('jsonInput').value.trim();
            
            if (!collectionName || !jsonInput) {
                alert('Please enter collection name and valid JSON');
                return;
            }

            try {
                const variables = JSON.parse(jsonInput);
                parent.postMessage({ pluginMessage: { type: "import", variables, collectionName } }, "*");
            } catch (error) {
                alert('Invalid JSON format');
                console.error(error);
            }
        }
    </script>
</body>
</html>
